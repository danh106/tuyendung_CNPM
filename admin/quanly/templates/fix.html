<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Sửa người dùng</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/sb-admin-2.min.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Poppins', sans-serif; background: linear-gradient(120deg, #fdfbfb, #ebedee); min-height:100vh; display:flex; align-items:center; justify-content:center; }
    .card { background:#fff; padding:40px 35px; border-radius:15px; box-shadow:0 15px 40px rgba(0,0,0,0.1); width:100%; max-width:550px; }
    h3 { color:#007bff; font-weight:600; margin-bottom:25px; text-align:center; }
    .back { display:inline-block; margin-bottom:20px; color:#555; text-decoration:none; font-weight:500; }
    .back:hover { color:#007bff; }
    form label { display:block; margin-bottom:6px; font-weight:500; color:#333; }
    form input, form select { width:100%; padding:12px 14px; margin-bottom:20px; border-radius:8px; border:1px solid #ccc; }
    form input:focus, form select:focus { border-color:#007bff; outline:none; box-shadow:0 0 5px rgba(0,123,255,0.3); }
    button { width:100%; padding:12px; background:#007bff; border:none; border-radius:8px; color:#fff; font-size:1em; font-weight:600; cursor:pointer; }
    button:hover { background:#0056b3; }
    .flash-message { padding:12px 15px; border-radius:8px; margin-bottom:20px; font-weight:500; text-align:center; }
    .flash-success { background-color:#28a745; color:#fff; }
    .flash-danger { background-color:#dc3545; color:#fff; }
  </style>
</head>
<body>
  <div class="card">
    <a href="{{ url_for('users') }}" class="back"><i class="fa-solid fa-arrow-left"></i> Quay lại danh sách</a>
    <h3><i class="fa-solid fa-pen-to-square"></i> Sửa người dùng</h3>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash-message flash-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

<form action="{{ url_for('fix_user', email=user.email) }}" method="POST">
      <input type="hidden" name="email" value="{{ user.email }}">

      <label>Họ và tên:</label>
      <input type="text" name="full_name" value="{{ user.full_name }}" required>

      <label>Mật khẩu mới (để trống nếu không đổi):</label>
      <input type="password" name="password" placeholder="Nhập mật khẩu mới nếu muốn đổi">

      <label>Vai trò:</label>
      <select name="role" required>
        <option value="applicant" {% if user.role=='applicant' %}selected{% endif %}>Applicant</option>
        <option value="recruiter" {% if user.role=='recruiter' %}selected{% endif %}>Recruiter</option>
        <option value="admin" {% if user.role=='admin' %}selected{% endif %}>Admin</option>
      </select>

      <button type="submit"><i class="fa-solid fa-floppy-disk"></i> Lưu thay đổi</button>
    </form>
  </div>
</body>
</html>
